[package]
name = "tree-sitter-pio"
description = "Pio grammar for tree-sitter"
version = "0.2.0"
authors = ["Niclas Metschke"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "pio", "tree-sitter"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-pio"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.26"

[build-dependencies]
cc = "1.2"
